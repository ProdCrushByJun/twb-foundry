  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function year(r) { return r[C["Ship Date"]].slice(0, 4); }
function sum(rows, col) { return rows.reduce(function (a, r) { return a + r[C[col]]; }, 0); }

// cards
document.getElementById("k-ship").textContent = fmt(R.length);
document.getElementById("k-cost").textContent = "$" + fmt(sum(R, "Freight Cost"));
document.getElementById("k-ot").textContent = (100 * sum(R, "On Time Flag") / R.length).toFixed(1) + "%";
document.getElementById("k-days").textContent = (sum(R, "Transit Days") / R.length).toFixed(1);

// clustered bar: shipments by carrier, series = year
(function () {
  var svg = document.getElementById("s-bar");
  var carriers = {}, years = ["2024", "2025"];
  R.forEach(function (r) { var c = r[C["Carrier"]]; carriers[c] = carriers[c] || {"2024": 0, "2025": 0}; carriers[c][year(r)]++; });
  var names = Object.keys(carriers).sort(function (a, b) { return (carriers[b]["2024"] + carriers[b]["2025"]) - (carriers[a]["2024"] + carriers[a]["2025"]); });
  var max = 0; names.forEach(function (n) { years.forEach(function (y) { max = Math.max(max, carriers[n][y]); }); });
  var top = Math.ceil(max / 200) * 200, x0 = 46, y0 = 196, w = 560, h = 150, colors = {"2024": "#118DFF", "2025": "#12239E"};
  var root = el("g", {"class": "chart", transform: "translate(0,6)"}, svg);
  var grid = el("g", {"class": "grid"}, root), ax = el("g", {"class": "axis-y"}, root);
  for (var t = 0; t <= top; t += top / 4) {
    var y = y0 - 6 - h * t / top;
    el("line", {x1: x0, x2: x0 + w, y1: y, y2: y, stroke: "#e1dfdd", "stroke-width": 1}, grid);
    el("text", {x: x0 - 6, y: y + 4, "text-anchor": "end"}, ax, fmt(t));
  }
  var plot = el("g", {"class": "plot", transform: "translate(" + x0 + ",0)"}, root);
  var band = w / names.length;
  names.forEach(function (n, i) {
    var g = el("g", {"class": "category", transform: "translate(" + (i * band) + ",0)"}, plot);
    years.forEach(function (yr, j) {
      var v = carriers[n][yr], bh = h * v / top, bx = band / 2 - 34 + j * 36;
      var bg = el("g", {"class": "series series-" + yr}, g);
      el("rect", {x: bx, y: y0 - 6 - bh, width: 32, height: bh, fill: colors[yr]}, bg);
      el("text", {x: bx + 16, y: y0 - 10 - bh, "text-anchor": "middle", style: "font-size:10px"}, bg, fmt(v));
    });
    el("text", {x: band / 2, y: y0 + 12, "text-anchor": "middle"}, g, n);
  });
  var lg = el("g", {"class": "legendBox", transform: "translate(" + (x0 + w - 110) + ",-2)"}, root);
  years.forEach(function (yr, j) {
    el("rect", {x: j * 56, y: 0, width: 10, height: 10, fill: colors[yr]}, lg);
    el("text", {x: j * 56 + 14, y: 9}, lg, yr);
  });
})();

// line: freight cost by month (24 points)
(function () {
  var svg = document.getElementById("s-line");
  var months = {}, mn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  R.forEach(function (r) { var k = r[C["Ship Date"]].slice(0, 7); months[k] = (months[k] || 0) + r[C["Freight Cost"]]; });
  var keys = Object.keys(months).sort();
  var max = 0; keys.forEach(function (k) { max = Math.max(max, months[k]); });
  var top = Math.ceil(max / 40000) * 40000, x0 = 52, y0 = 196, w = 540, h = 160;
  var root = el("g", {"class": "chart", transform: "translate(0,6)"}, svg);
  var grid = el("g", {"class": "grid"}, root), ax = el("g", {"class": "axis-y"}, root);
  for (var t = 0; t <= top; t += top / 4) {
    var y = y0 - 6 - h * t / top;
    el("line", {x1: x0, x2: x0 + w, y1: y, y2: y, stroke: "#e1dfdd", "stroke-width": 1}, grid);
    el("text", {x: x0 - 6, y: y + 4, "text-anchor": "end"}, ax, "$" + (t / 1000) + "K");
  }
  var plot = el("g", {"class": "plot"}, root), pts = [];
  var step = w / (keys.length - 1);
  var axx = el("g", {"class": "axis-x"}, root);
  keys.forEach(function (k, i) {
    var x = x0 + i * step, y = y0 - 6 - h * months[k] / top;
    pts.push(x + "," + y);
    if (i % 3 === 0) el("text", {x: x, y: y0 + 12, "text-anchor": "middle"}, axx, mn[+k.slice(5) - 1] + " " + k.slice(2, 4));
  });
  var s = el("g", {"class": "series"}, plot);
  el("polyline", {points: pts.join(" "), fill: "none", stroke: "#118DFF", "stroke-width": 2.5}, s);
  keys.forEach(function (k, i) { var p = pts[i].split(","); el("circle", {cx: p[0], cy: p[1], r: 3, fill: "#118DFF"}, s); });
})();

// matrix: freight cost, rows = region, columns = year, with totals
(function () {
  var regs = {}, tot = {"2024": 0, "2025": 0};
  R.forEach(function (r) {
    var g = r[C["Region"]], y = year(r), v = r[C["Freight Cost"]];
    regs[g] = regs[g] || {"2024": 0, "2025": 0}; regs[g][y] += v; tot[y] += v;
  });
  var names = Object.keys(regs).sort(function (a, b) { return (regs[b]["2024"] + regs[b]["2025"]) - (regs[a]["2024"] + regs[a]["2025"]); });
  var h = '<table><thead><tr><th class="rowHdr">Region</th><th>2024</th><th>2025</th><th>Total</th></tr></thead><tbody>';
  names.forEach(function (n) { h += '<tr><td class="rowName">' + n + '</td><td>$' + fmt(regs[n]["2024"]) + '</td><td>$' + fmt(regs[n]["2025"]) + '</td><td>$' + fmt(regs[n]["2024"] + regs[n]["2025"]) + '</td></tr>'; });
  h += '<tr class="grand"><td class="rowName">Total</td><td>$' + fmt(tot["2024"]) + '</td><td>$' + fmt(tot["2025"]) + '</td><td>$' + fmt(tot["2024"] + tot["2025"]) + '</td></tr></tbody></table>';
  document.getElementById("m-body").innerHTML = h;
})();
</script>
</body>
</html>
